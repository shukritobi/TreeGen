name: Validate TreeGen generator
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML and module syntax
        run: |
          python3 tests/static_test.py
          node --check --input-type=module < src/tree.js
          node --check --input-type=module < src/app.js
      - name: Test deterministic procedural geometry
        run: |
          node tests/engine_test.mjs
          node tests/qa_suite.mjs
      - name: Verify published bundle matches editable source
        run: |
          python3 tests/standalone_test.py
          git diff --exit-code -- index.html
